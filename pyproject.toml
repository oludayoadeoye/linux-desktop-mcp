[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-desktop-mcp"
version = "0.4.0"
description = "Cross-platform local Python MCP server for desktop automation and persistent Playwright browser control."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]<2",
    "pydantic>=2.14.3",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyautogui>=0.9.54; sys_platform == 'win32'",
]

[project.scripts]
linux-desktop-mcp = "cli:main"
desktop-control-mcp = "cli:main"

[tool.setuptools]
py-modules = ["main", "cli"]

[tool.setuptools.packages.find]
include = ["backends*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]
build = [
    "pyinstaller>=6.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
