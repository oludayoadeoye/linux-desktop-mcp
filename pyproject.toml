[project]
name = "linux-desktop-mcp"
version = "0.1.0"
description = "Local Python MCP server for KDE desktop automation and persistent Playwright browser control on Linux."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]<2",
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
