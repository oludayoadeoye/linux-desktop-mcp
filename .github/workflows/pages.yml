name: Deploy documentation to GitHub Pages

on:
  pull_request:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  # Run on every master push so a newer non-docs commit cannot strand a
  # documentation change by making its deployment SHA appear stale.
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Keep validation runs independent. A PR validation must never cancel a live
# deployment. The deploy job below serializes actual publications.
concurrency:
  group: github-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate documentation files
        run: |
          set -eu
          test -s site/index.html
          test -s site/assets/style.css
          test -s site/guides/quickstart.html
          test -s site/guides/architecture.html
          test -s site/guides/security.html
          test -s site/guides/contributing.html
          test -s site/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only publish commits that are the current master tip. PRs and manual
    # dispatches from other branches can validate/build but never publish.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    needs: build
    # Serialize publications so an older artifact cannot finish after and
    # overwrite a newer deployment. Newer master runs wait for the active one.
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v5
      - name: Ensure this is still the latest master commit
        run: |
          set -eu
          current_master_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [ "$GITHUB_SHA" != "$current_master_sha" ]; then
            echo "Refusing to publish stale commit $GITHUB_SHA; master is now $current_master_sha"
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
