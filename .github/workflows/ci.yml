name: Python CI and cross-platform releases

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
      - name: Check shell scripts
        run: bash -n install.sh scripts/install-arch.sh scripts/build-binary.sh
      - name: Compile Python modules
        run: uv run python -m compileall -q main.py cli.py kwin-bridge-service.py tests
      - name: Build Python distributions
        run: uv build

  macos-unit-tests:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group dev --no-install-package cryptography
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Test
        run: uv run --no-sync pytest -q
      - name: Build Python distributions
        run: uv build

  windows-unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
      - name: Build Python distributions
        run: uv build

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: [lint-test, macos-unit-tests, windows-unit-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-22.04
            binary: desktop-control-mcp
            archive: desktop-control-mcp-linux-x86_64
          - target: linux-aarch64
            os: ubuntu-22.04-arm
            binary: desktop-control-mcp
            archive: desktop-control-mcp-linux-aarch64
          - target: windows-x86_64
            os: windows-2025
            binary: desktop-control-mcp.exe
            archive: desktop-control-mcp-windows-x86_64.exe
            pyinstaller_args: --collect-all pyautogui
          - target: macos-x86_64
            os: macos-15-intel
            binary: desktop-control-mcp
            archive: desktop-control-mcp-macos-x86_64
            pyinstaller_args: --collect-all Quartz
          - target: macos-arm64
            os: macos-15
            binary: desktop-control-mcp
            archive: desktop-control-mcp-macos-arm64
            pyinstaller_args: --collect-all Quartz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install build dependencies (Intel macOS)
        if: matrix.target == 'macos-x86_64'
        run: uv sync --locked --group build --no-install-package cryptography
      - name: Install build dependencies
        if: matrix.target != 'macos-x86_64'
        run: uv sync --locked --group build
      - name: Build standalone executable
        shell: bash
        run: |
          uv run pyinstaller --clean --noconfirm --onefile --name desktop-control-mcp --collect-all mcp --collect-all pydantic --collect-submodules backends ${{ matrix.pyinstaller_args }} cli.py
      - name: Smoke test executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./dist/desktop-control-mcp --help
      - name: Smoke test executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dist/desktop-control-mcp.exe --help
      - name: Debian 12 compatibility smoke test
        if: matrix.target == 'linux-x86_64'
        run: |
          docker run --rm --platform linux/amd64 --volume "$PWD/dist/desktop-control-mcp:/usr/local/bin/desktop-control-mcp:ro" debian:12-slim /usr/local/bin/desktop-control-mcp --help
      - name: Debian 13 compatibility smoke test
        if: matrix.target == 'linux-x86_64'
        run: |
          docker run --rm --platform linux/amd64 --volume "$PWD/dist/desktop-control-mcp:/usr/local/bin/desktop-control-mcp:ro" debian:13-slim /usr/local/bin/desktop-control-mcp --help
      - name: Prepare release asset (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          cp "dist/${{ matrix.binary }}" "release/${{ matrix.archive }}"
      - name: Prepare release asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist/${{ matrix.binary }}" "release/${{ matrix.archive }}"
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 manifest
        run: |
          cd release-assets
          sha256sum desktop-control-mcp-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish all platform binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" release-assets/desktop-control-mcp-* release-assets/SHA256SUMS --clobber
