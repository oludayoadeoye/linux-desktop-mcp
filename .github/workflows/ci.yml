name: Python CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Compile Python modules
        run: uv run python -m compileall -q main.py cli.py kwin-bridge-service.py tests

      - name: Build wheel and source distribution
        run: uv build

      - name: Build standalone executable
        run: |
          uv sync --locked --group build
          ./scripts/build-binary.sh

      - name: Upload Linux executable
        uses: actions/upload-artifact@v6
        with:
          name: linux-desktop-mcp-linux-x86_64
          path: dist/linux-desktop-mcp
