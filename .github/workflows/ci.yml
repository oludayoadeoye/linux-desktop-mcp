name: Python CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-test-build:
    # Build on Ubuntu 22.04 to keep the glibc baseline compatible with modern Debian releases.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Check shell installer syntax
        run: bash -n install.sh scripts/install-arch.sh scripts/build-binary.sh

      - name: Compile Python modules
        run: uv run python -m compileall -q main.py cli.py kwin-bridge-service.py tests

      - name: Build wheel and source distribution
        run: uv build

      - name: Build standalone executable
        run: |
          uv sync --locked --group build
          ./scripts/build-binary.sh

      - name: Smoke test executable on Debian 12
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "$PWD/dist/linux-desktop-mcp:/usr/local/bin/linux-desktop-mcp:ro" \
            debian:12-slim /usr/local/bin/linux-desktop-mcp --help

      - name: Smoke test executable on Debian 13
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "$PWD/dist/linux-desktop-mcp:/usr/local/bin/linux-desktop-mcp:ro" \
            debian:13-slim /usr/local/bin/linux-desktop-mcp --help

      - name: Generate executable checksum
        run: cd dist && sha256sum linux-desktop-mcp > SHA256SUMS

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-desktop-mcp-linux-x86_64
          path: |
            dist/linux-desktop-mcp
            dist/SHA256SUMS

      - name: Attach executable and checksum to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/linux-desktop-mcp dist/SHA256SUMS --clobber
